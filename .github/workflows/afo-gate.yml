# AFO CI Gate — Bias Audit Pass/Fail Gate for Pull Requests
#
# ARCHITECTURAL NOTE (Gap #11, deliberate decision):
# This workflow runs compute_ci_gate() DIRECTLY as an inline Python step,
# NOT via an HTTP call to the FastAPI endpoint (orchestrator/api.py).
# Reason: GitHub's hosted runners cannot reach localhost:8100 — there is
# no public endpoint. The plain HTTP approach (Gap #11) still applies for
# any environment where the orchestrator API IS reachable (e.g. a deployed
# staging server or docker-compose integration test). For GitHub Actions,
# running the logic inline is equivalent and self-contained.
#
# The FastAPI endpoint (orchestrator/api.py → POST /ci-gate/{scan_run_id})
# exists and is tested locally — it is NOT MCP, deliberately plain HTTP.
# The same compute_ci_gate() function this workflow calls is what that
# endpoint wraps. Person A will wrap it again as an MCP tool (run_ci_gate)
# on feat/mcp-server-wrapper — that is NOT this session's work.

name: AFO Bias Gate

on:
  pull_request:
    branches:
      - main
      - feat/agent2-3-policy

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  SCAN_RUN_ID: "00000000-0000-0000-0000-000000000001"
  # GATE_MODE: "pass" (default) or "fail" (test failing case)
  GATE_MODE: "pass"

jobs:
  bias-gate:
    name: Bias Audit Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: afo
          POSTGRES_DB: afo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          cd afo/orchestrator
          pip install -r requirements.txt

      - name: Seed DB + run CI gate (inline Python)
        id: gate
        env:
          DATABASE_URL: postgresql://postgres:afo@localhost:5432/afo
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import sys, json, os, psycopg2
          sys.path.insert(0, "afo/orchestrator")

          # 1. Apply DB schema
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          with conn.cursor() as cur:
              with open("afo/orchestrator/db/schema.sql") as f:
                  cur.execute(f.read())
          conn.commit()
          conn.close()
          print("[ci-gate] DB schema applied successfully")

          # 2. Seed fixture data
          from fixtures.seed_fake_data import seed
          seed()

          # 3. Seed a mitigation_policy linked to both findings
          from db import repo
          policy = repo.insert_mitigation_policy(
              scan_run_id=os.environ["SCAN_RUN_ID"],
              redact_fields=["applicant_name", "zip_code"],
              neutral_value="REDACTED",
              group_adjustments={},
              rationale="CI gate test policy — fixture data",
          )
          print(f"[ci-gate] Seeded policy: {policy['id']}")

          # 4. Determine gate mode
          gate_mode = os.environ.get("GATE_MODE", "pass")

          if gate_mode == "fail":
              from graph import agent3_verifier as v
              from stats.dir import compute_dir
              from stats.fisher_bh import test_combo
              original_fn = v._simulate_post_patch_outcome
              def failing_fixture(combo_key):
                  a, b, c, d = 27, 23, 50, 0
                  dir_val = compute_dir(a, 50, c, 50)
                  odds_ratio, p_value = test_combo(a, b, c, max(d, 1))
                  return {
                      "combo_key": combo_key,
                      "counts": {"unpriv_approved": a, "unpriv_total": 50, "priv_approved": c, "priv_total": 50},
                      "dir_value": round(dir_val, 4),
                      "p_value": p_value,
                      "odds_ratio": odds_ratio,
                  }
              v._simulate_post_patch_outcome = failing_fixture

          from gate import compute_ci_gate
          result = compute_ci_gate(os.environ["SCAN_RUN_ID"])

          result_json = json.dumps(result)
          print(f"[ci-gate] Result: {result_json}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"passed={'true' if result['passed'] else 'false'}\n")
              f.write(f"result_json<<GATE_RESULT_EOF\n{result_json}\nGATE_RESULT_EOF\n")

          sys.exit(0)
          PYEOF
        env:
          SCAN_RUN_ID: ${{ env.SCAN_RUN_ID }}
          GATE_MODE: ${{ env.GATE_MODE }}

      - name: Evaluate Gate Result
        if: steps.gate.outputs.passed == 'false'
        run: |
          echo "::error::AFO Bias Gate FAILED — one or more combos still show disparate impact below the 0.80 DIR threshold or remain statistically significant after BH-FDR correction."
          echo ""
          echo "Full gate result:"
          echo '${{ steps.gate.outputs.result_json }}' | python3 -m json.tool
          exit 1

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const rawJson = `${{ steps.gate.outputs.result_json }}`;
            let response;
            try {
              response = JSON.parse(rawJson);
            } catch(e) {
              console.log("Could not parse gate result JSON:", e);
              response = { passed: false, summary: { combos: [], error: "Parse error: " + rawJson } };
            }
            const passed = response.passed;
            const summary = response.summary || {};
            const combos = summary.combos || [];

            let body = passed
              ? '## ✅ AFO Bias Gate — PASSED\n\n'
              : '## ❌ AFO Bias Gate — FAILED\n\n';

            if (summary.error) {
              body += `> **Error:** ${summary.error}\n\n`;
            }

            body += `| Combo | DIR | Adj. p-value | Dir ≥ 0.80? | Still sig? | Status |\n`;
            body += `|-------|-----|-------------|------------|-----------|--------|\n`;

            for (const c of combos) {
              const dirOk = c.dir_crossed_threshold ? '✅' : '❌';
              const sigOk = c.still_significant ? '❌ yes' : '✅ no';
              const status = c.passed ? '✅ Passed' : '❌ Failed';
              body += `| \`${c.combo_key}\` | ${c.dir_value} | ${c.adjusted_p} | ${dirOk} | ${sigOk} | ${status} |\n`;
            }

            body += `\n**Total combos:** ${summary.total_combos || 0}`;
            body += ` | **Passed:** ${summary.passed_combos || 0}`;
            body += ` | **Failed:** ${summary.failed_combos || 0}\n`;
            body += `\n_Policy ID: \`${summary.policy_id || 'N/A'}\`_\n`;
            body += `\n> Threshold: DIR ≥ 0.80 (four-fifths rule) AND BH-adjusted p ≥ 0.05 (not statistically significant)\n`;
            body += `> _This gate does not certify absence of bias — only that the four-fifths threshold has been crossed and the result is no longer statistically distinguishable from sampling noise at 95% confidence._`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
